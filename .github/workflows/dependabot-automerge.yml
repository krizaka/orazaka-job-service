# Dependabot auto-merge: patch and minor (grouped included) merge when the required checks pass; majors stay manual.
# Logic lives in krizaka/.github (reusable, pinned by SHA; `node scripts/pin-supply-chain.mjs --refresh` there moves it);
# this file only hands over the event and never checks out or runs the PR's code.
# Token-Permissions (OpenSSF Scorecard): read-only at the top, the write scopes on the job that needs them.
name: Dependabot auto-merge

on: pull_request_target # zizmor: ignore[dangerous-triggers] checks out nothing and runs no PR code; hands the event to the pinned reusable workflow
permissions:
  contents: read

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    uses: krizaka/.github/.github/workflows/dependabot-automerge.yml@a888de63a6049d329d7a8522c8d50af62a0f6350 # main

# What a GitHub coding agent (Copilot) needs before it works here: this component never builds alone, its parent
# POM and upstreams come from the Orazaka workspace. The action (krizaka/orazaka) clones the workspace, installs
# the upstreams into ~/.m2 and links the packs, so the agent can compile, format and run the tests like CI.
name: Copilot setup steps

on:
  workflow_dispatch:
  pull_request:
    paths: [.github/workflows/copilot-setup-steps.yml]

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: krizaka/orazaka/.github/actions/copilot-workspace@566fdd8ce2d199ca5a89ff17cc0331a210c520d8 # main
        with:
          component: ${{ github.event.repository.name }}
